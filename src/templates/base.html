<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- El título ahora es un bloque que las plantillas hijas pueden cambiar -->
    <title>{% block title %}Control de Requerimientos{% endblock %}</title>
    
    <!-- Hoja de estilos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- MENÚ DE NAVEGACIÓN (NAVBAR) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">GestiónPro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('index') }}">Dashboard</a>
                    </li>
                    <!-- Aquí podríamos añadir más enlaces en el futuro, como 'Estadísticas' -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container mt-4">
        <!-- Bloque para mostrar mensajes flash (alertas) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- ESTE ES EL HUECO QUE RELLENARÁN LAS PLANTILLAS HIJAS -->
        {% block content %}{% endblock %}
    </main>
    
    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="text-center text-muted mt-5 mb-3">
        <p>&copy; {{ now().strftime('%Y') }} - Mi Aplicación de Seguimiento</p>
    </footer>

    <!-- Scripts de Bootstrap (importante para funcionalidades como los menús desplegables) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
